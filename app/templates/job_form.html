{% extends "base.html" %}

{% block title %}
Add Job
{% endblock %}

{% block content %}

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header">
          <h3>Add New Job Application</h3>
        </div>
        <div class="card-body">
          <form method="POST" action="/jobs/new">
            <div class="mb-3">
              <label class="form-label">Company</label>
              <input 
                  type="text"
                  class="form-control"
                  name="company"
                  required>
            </div>

            <div class="mb-3">
               <label class="form-label">Job Title</label>
               <input 
                  type="text"
                  class="form-control"
                  name="job_title"
                  required>
            </div>

             <div class="mb-3">
               <label class="form-label">Location</label>
               <input 
                  type="text"
                  class="form-control"
                  name="location">
            </div>

            <div class="mb-3">
              <label class="form-label">Status</label>

              <select
                  class="form-select"
                  name="status">

                  <option>Applied</option>
                  <option>Interview</option>
                  <option>Offer</option>
                  <option>Rejected</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">
                Notes
              </label>

              <textarea
                  class="form-control"
                  rows="4"
                  name="notes"></textarea>
            </div>

            <button 
                 class="btn btn-success"
                 type="submit">
                
                 Save Job
            </button>
            

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
