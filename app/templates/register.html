{% extends "base.html" %}

{% block title %}
Register
{% endblock %} 

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-body p-5">
        <h2 class="text-center mb-4">
            Create Account
        </h2>
        <form method="POST" action="/register">
          <div class="mb-3">
            <label class="form-label">
              Username
            </label>
            <input
                type="text"
                class="form-control"
                name="username"
                required
            >    
          </div>
          <div class="mb-3">
            <label class="form-label">
              Email
            </label>

            <input
                type="email"
                class="form-control"
                name="email"
                required
            >    
          </div>
          <div class="mb-3">
            <label class="form-label">
              Password
            </label>
            <input
                type="password"
                class="form-control"
                name="password"
                required
            >    
          </div>
          <div class="mb-4">
            <label class="form-label">
                Confirm Password
            </label>
            <input
                type="password"
                class="form-control"
                name="confirm_password"
                required
            >    
          </div>
          <button
              type="submit"
              class="btn btn-primary w-100"
          >
              Register
          </button>    

        </form>

        <hr>

        <div class="text-center">
            Already have an account?
            <a href="/login">
              Login
            </a>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
