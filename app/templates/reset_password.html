{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">
  <h2 class="mb-4 text-center">Reset Password</h2>

  <form method="post" action="/reset-password">
    <input
        type="hidden"
        name="email"
        value="{{ email }}"
    >
    
    <div class="mb-3">
      <label class="form-label">New Password</label>

      <input
         type="password"
         name="password"
         class="form-control"
         required
      >   
    </div>

    <button
       type="submit"
       class="btn btn-primary w-100">
       Reset Password
    </button>
  </form>
</div>

{% endblock %}
