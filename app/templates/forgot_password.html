{% extends "base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">

  <h2 class="mb-4">Forgot Password</h2>

  <form method="post">
    <div class="mb-3">
      <label>Email</label>
      <input
          type="email"
          name="email"
          class="form-control"
          placeholder="Enter your email"
          required
        >
    </div>    
        
    <button class="btn btn-primary mt-3">
      Reset Password
    </button>
  </form>

</div>

{% endblock %}
